<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Chat</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --border: #e2e2df;
    --text: #1a1a1a;
    --text-muted: #8a8a86;
    --accent: #1a1a1a;
    --accent-text: #ffffff;
    --bubble-mine: #e8f0fe;
    --bubble-theirs: #ffffff;
    --danger: #c0392b;
  }
  [data-theme="dark"] {
    --bg: #17181a;
    --card: #212226;
    --border: #333438;
    --text: #ececec;
    --text-muted: #8f9095;
    --accent: #ececec;
    --accent-text: #17181a;
    --bubble-mine: #2b3a55;
    --bubble-theirs: #2a2b2f;
    --danger: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.15s ease, color 0.15s ease;
    visibility: hidden;
  }
  body.ready { visibility: visible; }
  .wrap { width: 100%; max-width: 440px; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: var(--text-muted); margin: 0 0 16px; }
  input[type="text"] {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--text-muted); }
  button {
    height: 42px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.97); }
  button:active { transform: scale(0.98); }
  #join-btn { width: 100%; background: var(--accent); color: var(--accent-text); border: none; }
  #login-screen { text-align: center; }
  #login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: left;
  }
  #chat-screen { display: none; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  #whoami { font-size: 12px; color: var(--text-muted); }
  #theme-toggle {
    width: 36px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    border-radius: 10px;
  }
  #messages {
    height: 400px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-name { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .msg-time { font-size: 10px; color: var(--text-muted); margin-left: 6px; }
  .msg-bubble {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 14px;
    max-width: 85%;
    background: var(--bubble-theirs);
    word-wrap: break-word;
  }
  .msg-mine .msg-bubble { background: var(--bubble-mine); }
  .msg-mine .msg-name { text-align: right; }
  .msg-row { display: flex; flex-direction: column; }
  .msg-row.msg-mine { align-items: flex-end; }
  .input-row { display: flex; gap: 8px; margin-top: 10px; }
  .input-row input { flex: 1; margin-bottom: 0; }
  #err { font-size: 12px; color: var(--danger); margin-top: 6px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login-screen">
    <div id="login-card">
      <h2>Join the chatroom</h2>
      <p class="sub">Pick a name your classmates will recognize.</p>
      <input id="name-input" type="text" placeholder="Your name" maxlength="20" />
      <button id="join-btn">Join chat</button>
    </div>
  </div>

  <div id="chat-screen">
    <div class="header-row">
      <h2>Class chat</h2>
      <div class="header-left">
        <span id="whoami"></span>
        <button id="theme-toggle" aria-label="Toggle dark mode">◐</button>
      </div>
    </div>
    <div id="messages"></div>
    <div class="input-row">
      <input id="msg-input" type="text" placeholder="Type a message..." maxlength="500" />
      <button id="send-btn">Send</button>
    </div>
    <p id="err"></p>
  </div>
</div>

<!-- Firebase SDKs (compat build, simplest to use with plain JS) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAbFuYloI-z2W-zKOIcjwgdyb_2a_sxL5s",
    authDomain: "ngasinparis-chatroom.firebaseapp.com",
    databaseURL: "https://ngasinparis-chatroom-default-rtdb.firebaseio.com",
    projectId: "ngasinparis-chatroom",
    storageBucket: "ngasinparis-chatroom.firebasestorage.app",
    messagingSenderId: "797925715171",
    appId: "1:797925715171:web:d3f4c2bc478ebeb1a029d6",
    measurementId: "G-X92CM3CNDX"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref("messages");

  let myName = null;

  const loginScreen = document.getElementById('login-screen');
  const chatScreen = document.getElementById('chat-screen');
  const nameInput = document.getElementById('name-input');
  const joinBtn = document.getElementById('join-btn');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const whoami = document.getElementById('whoami');
  const err = document.getElementById('err');
  const themeToggle = document.getElementById('theme-toggle');

  // --- Theme ---
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀' : '◐';
  }
  function initTheme() {
    const saved = localStorage.getItem('classroom-chat-theme');
    if (saved) return applyTheme(saved);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', function() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('classroom-chat-theme', next);
    applyTheme(next);
  });
  initTheme();

  function showError(text) {
    err.textContent = text;
    err.style.display = 'block';
  }
  function clearError() {
    err.style.display = 'none';
  }
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ampm;
  }

  function renderMessage(name, text, ts) {
    const isMe = name === myName;
    const row = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' msg-mine' : '');
    row.innerHTML =
      '<div class="msg-name">' + escapeHtml(name) + '<span class="msg-time">' + formatTime(ts) + '</span></div>' +
      '<div class="msg-bubble">' + escapeHtml(text) + '</div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function enterChat(name) {
    myName = name;
    localStorage.setItem('classroom-chat-name', name);
    loginScreen.style.display = 'none';
    chatScreen.style.display = 'block';
    whoami.textContent = 'You: ' + name;

    messagesRef.limitToLast(100).on('child_added', function(snapshot) {
      const m = snapshot.val();
      if (m && m.name && m.text) renderMessage(m.name, m.text, m.ts);
    });
  }

  function join() {
    const name = nameInput.value.trim();
    if (!name) {
      showError('Enter a name first.');
      return;
    }
    clearError();
    enterChat(name);
  }

  function send() {
    const text = msgInput.value.trim();
    if (!text) {
      showError('Type a message first.');
      return;
    }
    clearError();
    messagesRef.push({
      name: myName,
      text: text,
      ts: Date.now()
    }).catch(function() {
      showError('Could not send message. Check your connection and try again.');
    });
    msgInput.value = '';
    msgInput.focus();
  }

  joinBtn.addEventListener('click', join);
  nameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') join(); });
  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') send(); });

  // Remember me: skip straight to chat if a name was saved before
  const savedName = localStorage.getItem('classroom-chat-name');
  if (savedName) {
    nameInput.value = savedName;
    enterChat(savedName);
  }

  // Reveal body only after everything above has run, to avoid a flash of
  // unstyled/wrong-screen content on first load
  document.body.classList.add('ready');
</script>
</body>
</html>
