<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f2;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: #666; margin: 0 0 16px; }
  input[type="text"] {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  button {
    height: 40px;
    padding: 0 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #f0f0f0; }
  button:active { transform: scale(0.98); }
  #join-btn { width: 100%; background: #222; color: #fff; border: none; }
  #join-btn:hover { background: #333; }
  #chat-screen { display: none; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #whoami { font-size: 12px; color: #888; }
  #messages {
    height: 400px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg-name { font-size: 11px; color: #999; margin-bottom: 2px; }
  .msg-bubble {
    display: inline-block;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
    max-width: 85%;
  }
  .msg-mine .msg-bubble { background: #e8f0fe; }
  .msg-mine .msg-name { text-align: right; }
  .msg-row { display: flex; flex-direction: column; }
  .msg-row.msg-mine { align-items: flex-end; }
  .input-row { display: flex; gap: 8px; margin-top: 10px; }
  .input-row input { flex: 1; margin-bottom: 0; }
  #err { font-size: 12px; color: #c0392b; margin-top: 6px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login-screen">
    <h2>Join the chatroom</h2>
    <p class="sub">Pick a name your classmates will recognize.</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="20" />
    <button id="join-btn">Join chat</button>
  </div>

  <div id="chat-screen">
    <div class="header-row">
      <h2>Class chat</h2>
      <span id="whoami"></span>
    </div>
    <div id="messages"></div>
    <div class="input-row">
      <input id="msg-input" type="text" placeholder="Type a message..." maxlength="500" />
      <button id="send-btn">Send</button>
    </div>
    <p id="err"></p>
  </div>
</div>

<!-- Firebase SDKs (compat build, simplest to use with plain JS) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
  // 1. PASTE YOUR FIREBASE CONFIG HERE (from Firebase Console > Project Settings)
  const firebaseConfig = {
    apiKey: "AIzaSyAbFuYloI-z2W-zKOIcjwgdyb_2a_sxL5s",
    authDomain: "ngasinparis-chatroom.firebaseapp.com",
    databaseURL: "https://ngasinparis-chatroom-default-rtdb.firebaseio.com",
    projectId: "ngasinparis-chatroom",
    storageBucket: "ngasinparis-chatroom.firebasestorage.app",
    messagingSenderId: "797925715171",
    appId: "1:797925715171:web:d3f4c2bc478ebeb1a029d6",
    measurementId: "G-X92CM3CNDX"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref("messages");

  let myName = null;

  const loginScreen = document.getElementById('login-screen');
  const chatScreen = document.getElementById('chat-screen');
  const nameInput = document.getElementById('name-input');
  const joinBtn = document.getElementById('join-btn');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const whoami = document.getElementById('whoami');
  const err = document.getElementById('err');

  function showError(text) {
    err.textContent = text;
    err.style.display = 'block';
  }
  function clearError() {
    err.style.display = 'none';
  }
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderMessage(name, text) {
    const isMe = name === myName;
    const row = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' msg-mine' : '');
    row.innerHTML =
      '<div class="msg-name">' + escapeHtml(name) + '</div>' +
      '<div class="msg-bubble">' + escapeHtml(text) + '</div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function join() {
    const name = nameInput.value.trim();
    if (!name) {
      showError('Enter a name first.');
      return;
    }
    clearError();
    myName = name;
    localStorage.setItem('classroom-chat-name', name);
    loginScreen.style.display = 'none';
    chatScreen.style.display = 'block';
    whoami.textContent = 'You: ' + name;

    // Load last 100 messages, then listen for new ones
    messagesRef.limitToLast(100).on('child_added', function(snapshot) {
      const m = snapshot.val();
      if (m && m.name && m.text) renderMessage(m.name, m.text);
    });
  }

  function send() {
    const text = msgInput.value.trim();
    if (!text) {
      showError('Type a message first.');
      return;
    }
    clearError();
    messagesRef.push({
      name: myName,
      text: text,
      ts: Date.now()
    }).catch(function() {
      showError('Could not send message. Check your connection and try again.');
    });
    msgInput.value = '';
  }

  joinBtn.addEventListener('click', join);
  nameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') join(); });
  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') send(); });

  const savedName = localStorage.getItem('classroom-chat-name');
  if (savedName) nameInput.value = savedName;
</script>
</body>
</html>
